<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — تنبيهات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/csrf.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: #f0f7f4; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal; font-style: normal; font-size: 24px;
      line-height: 1; letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap; direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    .nav-glass {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,105,72,0.08);
      box-shadow: 0 1px 16px rgba(0,105,72,0.06);
    }
    .nav-active { background: #006948; color: white; }
    .nav-link   { color: #6b7280; transition: all 0.15s; }
    .nav-link:hover { background: #f0f7f4; color: #006948; }
    .alert-card {
      background: white;
      border-radius: 20px;
      border: 1px solid #e8f3ee;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: box-shadow 0.2s, transform 0.2s;
      overflow: hidden;
    }
    .alert-card:hover { box-shadow: 0 8px 28px rgba(0,105,72,0.12); transform: translateY(-2px); }
    .card-enter { animation: slideUp 0.22s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .details-icon { transition: transform 0.2s ease; }
    .details-icon.is-open { transform: rotate(180deg); }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen">

  {% include "_nav.html" %}

  <!-- Main (Alpine.js root) -->
  <div x-data="alertsApp()" x-init="init()" class="max-w-5xl mx-auto px-5 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6 gap-3 flex-wrap">
      <div>
        <h1 class="text-2xl font-black text-gray-900">تنبيهات</h1>
        <p class="text-xs text-gray-400 mt-0.5" x-show="!loading" x-cloak x-text="`${counts.total} عنصر يحتاج مراجعة`"></p>
        <p class="text-xs text-gray-400 mt-0.5" x-show="loading">رسائل عالقة تحتاج مراجعة أو إعادة محاولة</p>
      </div>
      <button @click="retryAll()" :disabled="counts.total === 0"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold border transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
        style="background:#f0f7f4; border-color:#b3d9cc; color:#006948">
        <span class="material-symbols-outlined" style="font-size:18px">sync</span>
        إعادة المحاولة للكل
      </button>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex items-center justify-center py-20 gap-3 text-gray-400">
      <div class="w-6 h-6 border-2 border-gray-200 border-t-[#006948] rounded-full animate-spin"></div>
      <span class="text-sm font-medium">جاري التحميل...</span>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && alerts.length === 0" x-cloak
      class="flex flex-col items-center py-24 text-gray-400 gap-4">
      <div class="w-24 h-24 rounded-full flex items-center justify-center text-5xl" style="background:#f0f7f4">🎉</div>
      <p class="font-bold text-base text-gray-500">لا توجد رسائل معلّقة 🎉</p>
      <p class="text-sm text-gray-400">كل شيء يعمل كما هو متوقع</p>
    </div>

    <!-- Content -->
    <div x-show="!loading && alerts.length > 0" x-cloak class="flex flex-col gap-8">

      <!-- Customer-facing: needs the aunt's attention now -->
      <div x-show="customerFacingAlerts.length > 0" x-cloak>
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-lg font-black text-red-600">تحتاج انتباهك الآن</h2>
          <span class="text-xs font-bold px-2 py-0.5 rounded-lg bg-red-50 text-red-600" x-text="customerFacingAlerts.length"></span>
        </div>
        <div class="flex flex-col gap-3">
          <template x-for="item in customerFacingAlerts" :key="item.id">
            <div class="alert-card card-enter p-4" x-data="{ open: false }">
              <p class="font-black text-gray-900 text-base leading-snug" x-text="item.what_happened"></p>
              <p class="text-sm text-gray-500 mt-1" x-text="item.what_to_do"></p>
              <p class="text-xs text-gray-400 mt-1" x-text="relativeTime(item.created_at)"></p>

              <div class="flex items-center gap-2 mt-3 flex-wrap">
                <a :href="item.wa_link" target="_blank" rel="noopener"
                  class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-white text-xs font-bold shadow-sm transition-all hover:shadow-md hover:-translate-y-0.5"
                  style="background:#006948">
                  <span class="material-symbols-outlined" style="font-size:16px">chat</span>
                  افتحي المحادثة
                </a>
                <button @click="retryOne(item)"
                  class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition-all hover:bg-gray-50"
                  style="border-color:#e8f3ee; color:#006948">
                  <span class="material-symbols-outlined" style="font-size:16px">refresh</span>
                  إعادة المحاولة
                </button>
              </div>

              <button @click="open = !open" class="flex items-center gap-1 mt-3 text-xs font-semibold text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined details-icon" :class="open ? 'is-open' : ''" style="font-size:18px">expand_more</span>
                تفاصيل تقنية
              </button>
              <div x-show="open" x-cloak x-transition class="mt-2 pt-3 border-t border-gray-100 text-xs text-gray-500 flex flex-col gap-1.5">
                <p><span class="font-bold text-gray-600">النوع: </span><span x-text="item.kind"></span></p>
                <p><span class="font-bold text-gray-600">المحاولات: </span><span x-text="item.attempts + (item.max_attempts ? ('/' + item.max_attempts) : '')"></span></p>
                <p class="break-words"><span class="font-bold text-gray-600">الخطأ: </span><span x-text="item.error"></span></p>
                <pre class="bg-gray-50 rounded-lg p-2 overflow-x-auto text-[10px] text-gray-500 whitespace-pre-wrap break-words" x-text="JSON.stringify(item.payload, null, 2)"></pre>
                <p class="text-[10px] text-gray-400 mt-1 leading-relaxed">قد يكرر هذا بعض الإجراءات إذا فشلت الرسالة الأصلية جزئياً</p>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Internal: technical failures with no direct customer fix -->
      <div x-show="internalAlerts.length > 0" x-cloak>
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-lg font-black text-gray-500">مشاكل تقنية</h2>
          <span class="text-xs font-bold px-2 py-0.5 rounded-lg bg-gray-100 text-gray-500" x-text="internalAlerts.length"></span>
        </div>
        <div class="flex flex-col gap-3">
          <template x-for="item in internalAlerts" :key="item.id">
            <div class="alert-card card-enter p-4" x-data="{ open: false }">
              <p class="font-black text-gray-900 text-base leading-snug" x-text="item.what_happened"></p>
              <p class="text-sm text-gray-500 mt-1" x-text="item.what_to_do"></p>
              <p class="text-xs text-gray-400 mt-1" x-text="relativeTime(item.created_at)"></p>

              <div class="flex items-center gap-2 mt-3">
                <button @click="retryOne(item)"
                  class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-white text-xs font-bold shadow-sm transition-all hover:shadow-md hover:-translate-y-0.5"
                  style="background:#006948">
                  <span class="material-symbols-outlined" style="font-size:16px">refresh</span>
                  إعادة المحاولة
                </button>
              </div>

              <button @click="open = !open" class="flex items-center gap-1 mt-3 text-xs font-semibold text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined details-icon" :class="open ? 'is-open' : ''" style="font-size:18px">expand_more</span>
                تفاصيل تقنية
              </button>
              <div x-show="open" x-cloak x-transition class="mt-2 pt-3 border-t border-gray-100 text-xs text-gray-500 flex flex-col gap-1.5">
                <p><span class="font-bold text-gray-600">النوع: </span><span x-text="item.kind"></span></p>
                <p><span class="font-bold text-gray-600">المحاولات: </span><span x-text="item.attempts + (item.max_attempts ? ('/' + item.max_attempts) : '')"></span></p>
                <p class="break-words"><span class="font-bold text-gray-600">الخطأ: </span><span x-text="item.error"></span></p>
                <pre class="bg-gray-50 rounded-lg p-2 overflow-x-auto text-[10px] text-gray-500 whitespace-pre-wrap break-words" x-text="JSON.stringify(item.payload, null, 2)"></pre>
                <p class="text-[10px] text-gray-400 mt-1 leading-relaxed">قد يكرر هذا بعض الإجراءات إذا فشلت الرسالة الأصلية جزئياً</p>
              </div>
            </div>
          </template>
        </div>
      </div>

    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak x-transition
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
      <div class="bg-gray-900 text-white text-sm font-semibold shadow-2xl rounded-2xl px-6 py-3">
        <span x-text="toast.msg"></span>
      </div>
    </div>

  </div>

<script>
function alertsApp() {
  return {
    alerts: [],
    counts: { total: 0, customer_facing: 0, internal: 0 },
    loading: true,
    toast: { show: false, msg: '' },

    async init() {
      await this.loadAlerts();
      this.loading = false;
    },

    async loadAlerts() {
      const res = await fetch('/api/alerts');
      const data = await res.json();
      this.alerts = data.alerts || [];
      this.counts = data.counts || { total: 0, customer_facing: 0, internal: 0 };
    },

    get customerFacingAlerts() {
      return this.alerts.filter(a => a.severity === 'customer_facing');
    },

    get internalAlerts() {
      return this.alerts.filter(a => a.severity === 'internal');
    },

    async retryOne(item) {
      const url = item.source === 'webhook_event'
        ? `/api/alerts/webhook_events/${item.id}/retry`
        : `/api/alerts/outbox_jobs/${item.id}/retry`;
      const res = await fetch(url, { method: 'POST' });
      if (res.ok) {
        this.alerts = this.alerts.filter(a => a.id !== item.id);
        this.recomputeCounts();
        this.showToast('تم جدولة إعادة المحاولة ✅');
      } else {
        this.showToast('⚠️ حدث خطأ، حاول مجدداً');
      }
    },

    async retryAll() {
      if (this.counts.total === 0) return;
      if (!confirm('هل تريدين إعادة محاولة كل العناصر العالقة؟ لا يمكن التراجع عن هذا.')) return;
      const res = await fetch('/api/alerts/retry_all', { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        const n = (data.webhook_events || 0) + (data.outbox_jobs || 0);
        await this.loadAlerts();
        this.showToast(`جدولت إعادة المحاولة لـ ${n} عنصر ✅`);
      } else {
        this.showToast('⚠️ حدث خطأ، حاول مجدداً');
      }
    },

    recomputeCounts() {
      const customerFacing = this.alerts.filter(a => a.severity === 'customer_facing').length;
      this.counts = {
        total: this.alerts.length,
        customer_facing: customerFacing,
        internal: this.alerts.length - customerFacing,
      };
    },

    relativeTime(d) {
      if (!d) return '';
      const then = new Date(d).getTime();
      if (isNaN(then)) return '';
      const diffSec = Math.floor((Date.now() - then) / 1000);
      if (diffSec < 60) return 'قبل لحظات';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `قبل ${diffMin} ${diffMin === 1 ? 'دقيقة' : 'دقائق'}`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `قبل ${diffHr} ${diffHr === 1 ? 'ساعة' : 'ساعات'}`;
      const diffDay = Math.floor(diffHr / 24);
      return `قبل ${diffDay} ${diffDay === 1 ? 'يوم' : 'أيام'}`;
    },

    showToast(msg) {
      this.toast.msg = msg;
      this.toast.show = true;
      setTimeout(() => { this.toast.show = false; }, 2500);
    }
  };
}
</script>
</body>
</html>
