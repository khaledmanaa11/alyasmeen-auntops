<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — الطلبات</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .card-enter { animation: slideUp 0.22s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <div class="navbar bg-base-100 border-b border-base-200 shadow-sm sticky top-0 z-20">
    <div class="w-full max-w-3xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌿</span>
        <span class="font-extrabold text-gray-900 text-lg tracking-tight">ALYASMEEN</span>
      </div>
      <div class="flex items-center gap-1 flex-wrap">
        <a href="/orders"    class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">الطلبات</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">الإحصائيات</a>
        <a href="/products"  class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">المنتجات</a>
        <a href="/broadcast" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">رسائل جماعية</a>
        <a href="/logout"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-red-500 transition-colors">خروج</a>
      </div>
    </div>
  </div>

  <div class="max-w-3xl mx-auto px-4 py-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900">الطلبات</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot inline-block"></span>
          <span id="last-refresh" class="text-xs text-gray-400">يتجدد تلقائياً كل 30 ثانية</span>
        </div>
      </div>
      <button onclick="loadAll()" id="refresh-btn"
        class="btn btn-sm bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 gap-2 font-semibold">
        <span id="refresh-icon" class="text-base leading-none">↻</span>
        تحديث
      </button>
    </div>

    <!-- Filter Tabs -->
    <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
      <button onclick="setFilter('to_do')"     data-filter="to_do"
        class="filter-btn btn btn-sm rounded-full border border-base-300 bg-base-100 text-gray-600 font-semibold shrink-0">
        يجب التجهيز <span class="count-badge" data-status="to_do"></span>
      </button>
      <button onclick="setFilter('ready')"     data-filter="ready"
        class="filter-btn btn btn-sm rounded-full border border-base-300 bg-base-100 text-gray-600 font-semibold shrink-0">
        جاهز <span class="count-badge" data-status="ready"></span>
      </button>
      <button onclick="setFilter('delivered')" data-filter="delivered"
        class="filter-btn btn btn-sm rounded-full border border-base-300 bg-base-100 text-gray-600 font-semibold shrink-0">
        في الطريق <span class="count-badge" data-status="delivered"></span>
      </button>
      <button onclick="setFilter('done')"      data-filter="done"
        class="filter-btn btn btn-sm rounded-full border border-base-300 bg-base-100 text-gray-600 font-semibold shrink-0">
        مكتمل <span class="count-badge" data-status="done"></span>
      </button>
    </div>

    <!-- Orders List -->
    <div id="orders-container"></div>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast toast-bottom toast-center z-50 hidden pointer-events-none">
    <div id="toast-msg" class="alert bg-gray-900 text-white text-sm shadow-xl rounded-2xl px-5 py-3 gap-2"></div>
  </div>

<script>
  let currentFilter = 'to_do';
  let allOrders = [];
  let autoRefreshTimer;

  const STATUS_LABEL = { to_do: 'يجب التجهيز', ready: 'جاهز', delivered: 'في الطريق', done: 'مكتمل' };
  const STATUS_BADGE = {
    to_do:     'badge text-xs font-bold bg-blue-100 text-blue-700 border-blue-200',
    ready:     'badge text-xs font-bold bg-amber-100 text-amber-700 border-amber-200',
    delivered: 'badge text-xs font-bold bg-orange-100 text-orange-700 border-orange-200',
    done:      'badge text-xs font-bold bg-emerald-100 text-emerald-700 border-emerald-200',
  };
  const NEXT_ACTION = {
    to_do:     [{ status: 'ready',     label: '✅ جاهز للتسليم',   cls: 'btn bg-amber-500 hover:bg-amber-600 border-0 text-white font-bold' }],
    ready:     [{ status: 'delivered', label: '📦 في الطريق',     cls: 'btn bg-orange-500 hover:bg-orange-600 border-0 text-white font-bold' },
                { status: 'done',      label: '🏁 مكتمل (استلام)', cls: 'btn bg-emerald-600 hover:bg-emerald-700 border-0 text-white font-bold' }],
    delivered: [{ status: 'done',      label: '🏁 تأكيد الاستلام', cls: 'btn bg-emerald-600 hover:bg-emerald-700 border-0 text-white font-bold' }],
    done:      [],
  };

  async function loadAll(silent = false) {
    if (!silent) spinRefresh(true);
    try {
      const res  = await fetch('/api/orders');
      const data = await res.json();
      allOrders  = data.orders || [];
      updateCounts();
      renderFiltered();
      document.getElementById('last-refresh').textContent =
        'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    } catch {
      document.getElementById('orders-container').innerHTML =
        '<div class="flex flex-col items-center py-16 text-red-400 gap-3"><span class="text-4xl">⚠️</span><p class="font-medium">تعذّر تحميل الطلبات</p></div>';
    }
    spinRefresh(false);
  }

  function updateCounts() {
    const counts = {};
    allOrders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
    document.querySelectorAll('.count-badge[data-status]').forEach(el => {
      const n = counts[el.dataset.status] || 0;
      el.textContent = n ? `(${n})` : '';
    });
  }

  function renderFiltered() {
    const list = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);
    renderOrders(list);
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const active = btn.dataset.filter === f;
      btn.className = active
        ? 'filter-btn btn btn-sm rounded-full shrink-0 bg-emerald-600 hover:bg-emerald-700 border-0 text-white font-semibold shadow-sm'
        : 'filter-btn btn btn-sm rounded-full border border-base-300 bg-base-100 text-gray-600 font-semibold shrink-0 hover:border-emerald-400 hover:text-emerald-700';
    });
    renderFiltered();
    setTimeout(loadVisibleLines, 100);
  }

  function renderOrders(orders) {
    const container = document.getElementById('orders-container');
    if (!orders.length) {
      container.innerHTML = `
        <div class="flex flex-col items-center py-20 text-gray-400 gap-3">
          <span class="text-6xl">📭</span>
          <p class="font-medium text-base">لا توجد طلبات في هذه الحالة</p>
        </div>`;
      return;
    }
    container.innerHTML = orders.map((o, i) => buildCard(o, i)).join('');
  }

  function buildCard(o, i) {
    const badge      = `<span class="${STATUS_BADGE[o.status] || 'badge bg-gray-100 text-gray-600'} px-2.5 py-1">${STATUS_LABEL[o.status] || o.status}</span>`;
    const isDelivery = o.fulfillment === 'delivery';
    const date       = o.created_at
      ? new Date(o.created_at).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : '';
    const waLink     = `https://wa.me/${(o.phone || '').replace(/\D/g, '')}`;
    const actions    = NEXT_ACTION[o.status] || [];
    const actionBtns = actions.map(a =>
      `<button onclick="updateStatus(${o.id}, '${a.status}', this)"
        class="${a.cls} flex-1 btn-sm h-11 rounded-xl text-sm shadow-sm">
        ${a.label}
      </button>`
    ).join('');

    const productsHtml = `
      <div id="lines-${o.id}" class="lines-container mt-3 pt-3 border-t border-base-200">
        <div class="text-xs text-gray-400 italic">جاري تحميل المنتجات...</div>
      </div>`;

    return `
      <div class="card bg-base-100 border border-base-200 shadow-sm mb-4 overflow-hidden card-enter"
           style="animation-delay:${i * 0.04}s" id="order-${o.id}">
        <div class="card-body p-4 pb-0 gap-0">

          <!-- Header row -->
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap mb-1">
                <span class="font-extrabold text-gray-900 text-base">${o.customer_name || 'عميل'}</span>
                ${badge}
                <span class="badge text-xs font-medium ${isDelivery ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-gray-100 text-gray-600 border-gray-200'}">
                  ${isDelivery ? '🚚 توصيل' : '🏪 استلام'}
                </span>
              </div>
              <a href="${waLink}" target="_blank"
                class="inline-flex items-center gap-1 text-xs text-emerald-600 hover:text-emerald-700 font-medium">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                ${o.phone}
              </a>
            </div>
            <div class="text-left shrink-0">
              <div class="text-xl font-extrabold text-gray-900">₪${parseFloat(o.total || 0).toFixed(2)}</div>
              <div class="text-xs text-gray-400 mt-0.5">${date}</div>
            </div>
          </div>

          ${isDelivery && o.address ? `
          <div class="mt-2.5 flex items-start gap-1.5 bg-purple-50 border border-purple-100 rounded-xl px-3 py-2">
            <span class="text-sm mt-0.5">📍</span>
            <span class="text-sm text-purple-800 font-medium">${o.address}</span>
          </div>` : ''}

          ${productsHtml}
        </div>

        <!-- Actions -->
        <div class="px-4 py-4">
          ${actionBtns
            ? `<div class="flex gap-2">${actionBtns}</div>`
            : `<div class="text-center text-xs text-gray-400 py-2 bg-base-200 rounded-xl">✔ تم إنجاز هذا الطلب</div>`
          }
        </div>
      </div>`;
  }

  async function loadLines(orderId) {
    const el = document.getElementById(`lines-${orderId}`);
    if (!el || el.dataset.loaded === 'ok') return;
    el.dataset.loaded = 'ok';
    try {
      const res   = await fetch(`/api/orders/${orderId}/lines`);
      const data  = await res.json();
      const lines = data.lines || [];
      if (!lines.length) { el.innerHTML = '<p class="text-xs text-gray-400">لا توجد منتجات</p>'; return; }
      el.innerHTML = lines.map(l => `
        <div class="flex items-center justify-between py-1.5 border-b border-base-200 last:border-0">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center shrink-0">${l.qty}</span>
            <span class="text-sm text-gray-800 font-medium">${l.product_name}</span>
          </div>
          <span class="text-sm font-semibold text-gray-700 shrink-0">₪${parseFloat(l.line_total || 0).toFixed(2)}</span>
        </div>`).join('');
    } catch {
      el.innerHTML = '<p class="text-xs text-red-400">تعذّر تحميل المنتجات</p>';
    }
  }

  function loadVisibleLines() {
    document.querySelectorAll('[id^="lines-"]').forEach(el => {
      loadLines(el.id.replace('lines-', ''));
    });
  }

  async function updateStatus(orderId, newStatus, btn) {
    const original = btn.innerHTML;
    btn.disabled  = true;
    btn.innerHTML = '<span class="loading loading-spinner loading-xs"></span> يتم التحديث...';
    try {
      const res = await fetch(`/api/orders/${orderId}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (!res.ok) throw new Error();
      showToast('✅ تم تحديث الطلب وإرسال إشعار للعميل');
      await loadAll(true);
    } catch {
      btn.disabled  = false;
      btn.innerHTML = original;
      showToast('⚠️ حدث خطأ، حاول مجدداً');
    }
  }

  function spinRefresh(on) {
    const icon = document.getElementById('refresh-icon');
    icon.style.animation = on ? 'spin 0.8s linear infinite' : '';
    icon.style.display = 'inline-block';
  }

  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
  }

  function startAutoRefresh() {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => loadAll(true), 30000);
  }

  setFilter('to_do');
  loadAll().then(() => setTimeout(loadVisibleLines, 150));
  startAutoRefresh();
</script>
</body>
</html>
