<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — المنتجات</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .card-enter { animation: slideUp 0.2s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <div class="navbar bg-base-100 border-b border-base-200 shadow-sm sticky top-0 z-20">
    <div class="w-full max-w-3xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌿</span>
        <span class="font-extrabold text-gray-900 text-lg tracking-tight">ALYASMEEN</span>
      </div>
      <div class="flex items-center gap-1 flex-wrap">
        <a href="/orders"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">الطلبات</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">الإحصائيات</a>
        <a href="/products"  class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">المنتجات</a>
        <a href="/broadcast" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-base-200 transition-colors">رسائل جماعية</a>
        <a href="/logout"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-red-500 transition-colors">خروج</a>
      </div>
    </div>
  </div>

  <!-- Main (Alpine.js root) -->
  <div x-data="productsApp()" x-init="init()" class="max-w-3xl mx-auto px-4 py-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900">المنتجات</h1>
        <p class="text-xs text-gray-400 mt-0.5" x-text="products.length + ' منتج مسجّل'"></p>
      </div>
      <button @click="openAdd()"
        class="btn bg-emerald-600 hover:bg-emerald-700 border-0 text-white text-sm font-bold gap-2 shadow-sm">
        <span class="text-lg leading-none">+</span>
        إضافة منتج
      </button>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex items-center justify-center py-16 gap-2 text-gray-400">
      <span class="loading loading-spinner loading-md"></span>
      <span class="text-sm">جاري التحميل...</span>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && products.length === 0" x-cloak
      class="flex flex-col items-center py-16 text-gray-400 gap-3">
      <span class="text-6xl">🌿</span>
      <p class="font-semibold text-base">لا توجد منتجات بعد</p>
      <p class="text-sm">اضغط "إضافة منتج" لتبدأ</p>
    </div>

    <!-- Product list -->
    <div x-show="!loading && products.length > 0" x-cloak class="flex flex-col gap-3">
      <template x-for="p in products" :key="p.id">
        <div class="card bg-base-100 border border-base-200 shadow-sm card-enter">
          <div class="card-body p-4 gap-0">

            <div class="flex items-start justify-between gap-3">
              <!-- Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <span class="font-extrabold text-gray-900 text-base" x-text="p.name"></span>
                  <span x-show="p.active"
                    class="badge badge-sm bg-emerald-100 text-emerald-700 border-emerald-200 font-semibold">فعّال</span>
                  <span x-show="!p.active"
                    class="badge badge-sm bg-gray-100 text-gray-400 border-gray-200 font-semibold">مخفي</span>
                </div>
                <p class="text-xs text-gray-500 leading-relaxed" x-show="p.description" x-text="p.description"></p>
                <p class="text-xs text-gray-400 mt-1" x-show="p.tags" x-text="p.tags"></p>
              </div>
              <!-- Price -->
              <div class="shrink-0 text-left">
                <p class="text-xl font-extrabold text-emerald-600" x-text="p.price.toFixed(2) + '₪'"></p>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 mt-3 pt-3 border-t border-base-200">
              <button @click="openEdit(p)"
                class="btn btn-sm flex-1 bg-base-100 hover:bg-base-200 border border-base-300 text-gray-600 font-semibold text-xs gap-1">
                ✏️ تعديل
              </button>
              <button @click="toggleProduct(p)"
                :class="p.active
                  ? 'btn btn-sm flex-1 bg-base-100 hover:bg-amber-50 border border-amber-200 text-amber-600 font-semibold text-xs gap-1'
                  : 'btn btn-sm flex-1 bg-base-100 hover:bg-emerald-50 border border-emerald-200 text-emerald-600 font-semibold text-xs gap-1'">
                <span x-text="p.active ? '🔴 إخفاء' : '🟢 تفعيل'"></span>
              </button>
              <button @click="deleteProduct(p)"
                class="btn btn-sm bg-base-100 hover:bg-red-50 border border-red-100 text-red-400 hover:text-red-600 font-semibold text-xs px-3">
                حذف
              </button>
            </div>

          </div>
        </div>
      </template>
    </div>

    <!-- ── DaisyUI Modal ── -->
    <div class="modal" :class="modal.open ? 'modal-open' : ''" x-cloak>
      <div class="modal-box w-full max-w-md bg-white rounded-2xl p-6 shadow-2xl">

        <div class="flex items-center justify-between mb-5">
          <h3 class="font-extrabold text-gray-900 text-lg" x-text="modal.title"></h3>
          <button @click="closeModal()"
            class="btn btn-ghost btn-sm btn-circle text-gray-400 hover:text-gray-600">✕</button>
        </div>

        <div class="flex flex-col gap-4">

          <div class="form-control">
            <label class="label pb-1">
              <span class="label-text font-semibold text-gray-700">اسم المنتج <span class="text-red-500">*</span></span>
            </label>
            <input type="text" x-model="modal.name" placeholder="مثال: كريم اليدين"
              class="input input-bordered focus:input-success w-full text-sm" />
          </div>

          <div class="form-control">
            <label class="label pb-1">
              <span class="label-text font-semibold text-gray-700">السعر (₪) <span class="text-red-500">*</span></span>
            </label>
            <input type="number" x-model="modal.price" min="0.01" step="0.01" placeholder="0.00"
              class="input input-bordered focus:input-success w-full text-sm" />
          </div>

          <div class="form-control">
            <label class="label pb-1">
              <span class="label-text font-semibold text-gray-700">الوصف</span>
            </label>
            <textarea x-model="modal.description" rows="2" placeholder="وصف قصير للمنتج..."
              class="textarea textarea-bordered focus:textarea-success w-full text-sm resize-none"></textarea>
          </div>

          <div class="form-control">
            <label class="label pb-1">
              <span class="label-text font-semibold text-gray-700">الوسوم</span>
            </label>
            <input type="text" x-model="modal.tags" placeholder="مثال: مرطب, طبيعي, للبشرة"
              class="input input-bordered focus:input-success w-full text-sm" />
            <label class="label pt-1">
              <span class="label-text-alt text-gray-400">افصل بين الوسوم بفاصلة</span>
            </label>
          </div>

        </div>

        <!-- Error -->
        <div x-show="modal.error" x-cloak
          class="alert alert-error text-sm py-2 mt-3 rounded-xl">
          <span x-text="modal.error"></span>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 mt-5">
          <button @click="saveProduct()" :disabled="modal.saving"
            class="btn flex-1 bg-emerald-600 hover:bg-emerald-700 border-0 text-white font-bold text-sm">
            <span x-show="modal.saving" class="loading loading-spinner loading-xs"></span>
            <span x-text="modal.saving ? 'جاري الحفظ...' : 'حفظ'"></span>
          </button>
          <button @click="closeModal()"
            class="btn flex-1 bg-base-100 hover:bg-base-200 border border-base-300 text-gray-600 font-medium text-sm">
            إلغاء
          </button>
        </div>

      </div>
      <div class="modal-backdrop bg-black/40" @click="closeModal()"></div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak x-transition
      class="toast toast-bottom toast-center z-50 pointer-events-none">
      <div class="alert bg-gray-900 text-white text-sm shadow-xl rounded-2xl px-5 py-3">
        <span x-text="toast.msg"></span>
      </div>
    </div>

  </div><!-- /x-data -->

<script>
function productsApp() {
  return {
    products: [],
    loading: true,
    toast: { show: false, msg: '' },
    modal: {
      open: false, editingId: null, title: '',
      name: '', price: '', description: '', tags: '',
      error: '', saving: false
    },

    async init() {
      await this.loadProducts();
      this.loading = false;
      document.addEventListener('keydown', e => { if (e.key === 'Escape') this.closeModal(); });
    },

    async loadProducts() {
      const res = await fetch('/api/products');
      const data = await res.json();
      this.products = data.products || [];
    },

    openAdd() {
      Object.assign(this.modal, {
        open: true, editingId: null, title: 'إضافة منتج جديد',
        name: '', price: '', description: '', tags: '', error: '', saving: false
      });
    },

    openEdit(product) {
      Object.assign(this.modal, {
        open: true, editingId: product.id, title: 'تعديل المنتج',
        name: product.name, price: product.price,
        description: product.description || '', tags: product.tags || '',
        error: '', saving: false
      });
    },

    closeModal() { this.modal.open = false; },

    async saveProduct() {
      this.modal.error = '';
      if (!this.modal.name.trim()) { this.modal.error = 'يرجى إدخال اسم المنتج'; return; }
      const price = parseFloat(this.modal.price);
      if (!price || price <= 0) { this.modal.error = 'يرجى إدخال سعر صحيح أكبر من صفر'; return; }

      this.modal.saving = true;
      const body = {
        name: this.modal.name.trim(), price,
        description: this.modal.description.trim(),
        tags: this.modal.tags.trim()
      };
      const url = this.modal.editingId ? `/api/products/${this.modal.editingId}` : '/api/products';
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      this.modal.saving = false;

      if (res.ok) {
        const msg = this.modal.editingId ? '✅ تم تحديث المنتج' : '✅ تم إضافة المنتج';
        this.closeModal();
        await this.loadProducts();
        this.showToast(msg);
      } else {
        const err = await res.json().catch(() => ({}));
        this.modal.error = err.detail || 'حدث خطأ، يرجى المحاولة مجدداً';
      }
    },

    async toggleProduct(product) {
      const res = await fetch(`/api/products/${product.id}/toggle`, { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        await this.loadProducts();
        this.showToast(data.active ? '🟢 المنتج فعّال الآن' : '🔴 المنتج مخفي عن العملاء');
      }
    },

    async deleteProduct(product) {
      if (!confirm(`هل أنت متأكد من حذف "${product.name}"؟\nلا يمكن التراجع عن هذا الإجراء.`)) return;
      const res = await fetch(`/api/products/${product.id}/delete`, { method: 'POST' });
      if (res.ok) {
        await this.loadProducts();
        this.showToast('🗑️ تم حذف المنتج');
      }
    },

    showToast(msg) {
      this.toast.msg = msg;
      this.toast.show = true;
      setTimeout(() => { this.toast.show = false; }, 2500);
    }
  };
}
</script>
</body>
</html>
