<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — المنتجات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .card-enter { animation: slideUp 0.2s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-backdrop {
      animation: fadeIn 0.15s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌿</span>
        <span class="font-extrabold text-gray-900 text-lg tracking-tight">ALYASMEEN</span>
      </div>
      <div class="flex items-center gap-1">
        <a href="/orders"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100">الطلبات</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100">الإحصائيات</a>
        <a href="/products"  class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">المنتجات</a>
        <a href="/broadcast" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100">رسائل جماعية</a>
        <a href="/logout"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-red-500">خروج</a>
      </div>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-4 py-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-2xl font-extrabold text-gray-900">المنتجات</h1>
      <button onclick="openModal()"
        class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-colors shadow-sm">
        <span class="text-base leading-none">+</span>
        إضافة منتج
      </button>
    </div>

    <!-- Product list -->
    <div id="product-list" class="flex flex-col gap-3">
      <div class="text-center text-gray-400 text-sm py-10">جاري التحميل...</div>
    </div>

  </div>

  <!-- ── Modal ── -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <!-- backdrop -->
    <div class="modal-backdrop absolute inset-0 bg-black/40" onclick="closeModal()"></div>

    <!-- panel -->
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md p-6 z-10">
      <h2 id="modal-title" class="text-lg font-extrabold text-gray-900 mb-5">إضافة منتج جديد</h2>

      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">اسم المنتج <span class="text-red-500">*</span></label>
          <input id="f-name" type="text" placeholder="مثال: كريم اليدين"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">السعر (₪) <span class="text-red-500">*</span></label>
          <input id="f-price" type="number" min="0.01" step="0.01" placeholder="0.00"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">الوصف</label>
          <textarea id="f-description" rows="2" placeholder="وصف قصير للمنتج..."
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200 resize-none"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">الوسوم</label>
          <input id="f-tags" type="text" placeholder="مثال: مرطب, طبيعي, للبشرة"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200" />
          <p class="text-xs text-gray-400 mt-1">افصل بين الوسوم بفاصلة</p>
        </div>
      </div>

      <p id="modal-error" class="hidden text-sm text-red-500 mt-3"></p>

      <div class="flex gap-3 mt-6">
        <button id="modal-save-btn" onclick="saveProduct()"
          class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm py-2.5 rounded-xl transition-colors">
          حفظ
        </button>
        <button onclick="closeModal()"
          class="flex-1 border border-gray-200 text-gray-600 hover:bg-gray-50 font-medium text-sm py-2.5 rounded-xl transition-colors">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50
    bg-gray-900 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-lg">
  </div>

  <script>
    let editingId = null;

    // ── Load products ────────────────────────────────────────────────────────
    async function loadProducts() {
      const res = await fetch('/api/products');
      const data = await res.json();
      renderList(data.products || []);
    }

    function renderList(products) {
      const el = document.getElementById('product-list');
      if (!products.length) {
        el.innerHTML = `
          <div class="text-center py-16 text-gray-400">
            <div class="text-4xl mb-3">🌿</div>
            <p class="font-medium">لا توجد منتجات بعد</p>
            <p class="text-sm mt-1">اضغط "إضافة منتج" لتبدأ</p>
          </div>`;
        return;
      }
      el.innerHTML = products.map(p => `
        <div class="card-enter bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-extrabold text-gray-900 text-base">${esc(p.name)}</span>
                ${p.active
                  ? `<span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-2 py-0.5 rounded-full">فعّال</span>`
                  : `<span class="bg-gray-100 text-gray-400 text-xs font-semibold px-2 py-0.5 rounded-full">مخفي</span>`
                }
              </div>
              ${p.description ? `<p class="text-xs text-gray-500 mt-1 leading-relaxed">${esc(p.description)}</p>` : ''}
              ${p.tags ? `<p class="text-xs text-gray-400 mt-1">${esc(p.tags)}</p>` : ''}
            </div>
            <div class="text-left shrink-0">
              <p class="text-lg font-extrabold text-emerald-600">${p.price.toFixed(2)}₪</p>
            </div>
          </div>
          <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-50">
            <button onclick="openModal(${p.id})"
              class="flex-1 text-xs font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 border border-gray-200 rounded-lg py-1.5 transition-colors">
              ✏️ تعديل
            </button>
            <button onclick="toggleProduct(${p.id})"
              class="flex-1 text-xs font-semibold ${p.active ? 'text-amber-600 hover:bg-amber-50 border-amber-200' : 'text-emerald-600 hover:bg-emerald-50 border-emerald-200'} border rounded-lg py-1.5 transition-colors">
              ${p.active ? '🔴 إخفاء' : '🟢 تفعيل'}
            </button>
            <button onclick="deleteProduct(${p.id}, '${esc(p.name)}')"
              class="text-xs font-semibold text-red-400 hover:text-red-600 hover:bg-red-50 border border-red-100 rounded-lg px-3 py-1.5 transition-colors">
              حذف
            </button>
          </div>
        </div>
      `).join('');
    }

    // ── Modal ────────────────────────────────────────────────────────────────
    let allProducts = [];

    async function openModal(id = null) {
      editingId = id;
      document.getElementById('modal-error').classList.add('hidden');

      if (id !== null) {
        const res = await fetch('/api/products');
        const data = await res.json();
        const p = (data.products || []).find(x => x.id === id);
        if (!p) return;
        document.getElementById('modal-title').textContent = 'تعديل المنتج';
        document.getElementById('f-name').value        = p.name;
        document.getElementById('f-price').value       = p.price;
        document.getElementById('f-description').value = p.description;
        document.getElementById('f-tags').value        = p.tags;
      } else {
        document.getElementById('modal-title').textContent = 'إضافة منتج جديد';
        document.getElementById('f-name').value        = '';
        document.getElementById('f-price').value       = '';
        document.getElementById('f-description').value = '';
        document.getElementById('f-tags').value        = '';
      }

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('f-name').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    }

    async function saveProduct() {
      const name  = document.getElementById('f-name').value.trim();
      const price = parseFloat(document.getElementById('f-price').value);
      const errEl = document.getElementById('modal-error');

      if (!name) {
        errEl.textContent = 'يرجى إدخال اسم المنتج';
        errEl.classList.remove('hidden');
        return;
      }
      if (!price || price <= 0) {
        errEl.textContent = 'يرجى إدخال سعر صحيح أكبر من صفر';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');

      const btn = document.getElementById('modal-save-btn');
      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';

      const body = {
        name,
        price,
        description: document.getElementById('f-description').value.trim(),
        tags:        document.getElementById('f-tags').value.trim(),
      };

      const url = editingId !== null ? `/api/products/${editingId}` : '/api/products';
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      btn.disabled = false;
      btn.textContent = 'حفظ';

      if (res.ok) {
        closeModal();
        toast(editingId !== null ? '✅ تم تحديث المنتج' : '✅ تم إضافة المنتج');
        loadProducts();
      } else {
        const err = await res.json().catch(() => ({}));
        errEl.textContent = err.detail || 'حدث خطأ، يرجى المحاولة مجدداً';
        errEl.classList.remove('hidden');
      }
    }

    // ── Toggle ───────────────────────────────────────────────────────────────
    async function toggleProduct(id) {
      const res = await fetch(`/api/products/${id}/toggle`, { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        toast(data.active ? '🟢 المنتج فعّال الآن' : '🔴 المنتج مخفي عن العملاء');
        loadProducts();
      }
    }

    // ── Delete ───────────────────────────────────────────────────────────────
    async function deleteProduct(id, name) {
      if (!confirm(`هل أنت متأكد من حذف "${name}"؟\nلا يمكن التراجع عن هذا الإجراء.`)) return;
      const res = await fetch(`/api/products/${id}/delete`, { method: 'POST' });
      if (res.ok) {
        toast('🗑️ تم حذف المنتج');
        loadProducts();
      }
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Keyboard: close modal on Escape ──────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    loadProducts();
  </script>
</body>
</html>
