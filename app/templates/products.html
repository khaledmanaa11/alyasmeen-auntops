<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — المنتجات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: #f0f7f4; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal; font-style: normal; font-size: 24px;
      line-height: 1; letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap; direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    .nav-glass {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,105,72,0.08);
      box-shadow: 0 1px 16px rgba(0,105,72,0.06);
    }
    .nav-active { background: #006948; color: white; }
    .nav-link   { color: #6b7280; transition: all 0.15s; }
    .nav-link:hover { background: #f0f7f4; color: #006948; }
    .product-card {
      background: white;
      border-radius: 20px;
      border: 1px solid #e8f3ee;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: box-shadow 0.2s, transform 0.2s;
      overflow: hidden;
    }
    .product-card:hover { box-shadow: 0 8px 28px rgba(0,105,72,0.12); transform: translateY(-3px); }
    .card-enter { animation: slideUp 0.22s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Toggle switch */
    .toggle-track {
      width: 40px; height: 22px; border-radius: 11px;
      transition: background 0.2s; cursor: pointer; position: relative;
      display: flex; align-items: center; padding: 0 3px;
      direction: ltr;
    }
    .toggle-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: white; transition: transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .toggle-on  { background: #006948; }
    .toggle-off { background: #d1d5db; }
    .toggle-on .toggle-thumb  { transform: translateX(18px); }
    .toggle-off .toggle-thumb { transform: translateX(0); }
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .input-field {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 14px;
      padding: 10px 14px; font-size: 14px; color: #374151;
      background: #fafafa; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-field:focus { outline: none; border-color: #006948; box-shadow: 0 0 0 3px rgba(0,105,72,0.1); }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="nav-glass sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="/orders" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-sm shrink-0"
             style="background: linear-gradient(135deg, #006948, #00a36c)">
          <span class="text-white text-base leading-none">🌿</span>
        </div>
        <div class="leading-tight">
          <span class="font-black text-gray-900 text-base tracking-tight block">ALYASMEEN</span>
          <span class="text-xs text-gray-400 block">لوحة الإدارة</span>
        </div>
      </a>
      <div class="flex items-center gap-1">
        <a href="/orders"    class="nav-link px-3 py-1.5 rounded-xl text-sm font-medium">الطلبات</a>
        <a href="/dashboard" class="nav-link px-3 py-1.5 rounded-xl text-sm font-medium">الإحصائيات</a>
        <a href="/products"  class="nav-active px-3 py-1.5 rounded-xl text-sm font-bold shadow-sm">المنتجات</a>
        <a href="/broadcast" class="nav-link px-3 py-1.5 rounded-xl text-sm font-medium">رسائل</a>
        <a href="/alerts" class="nav-link px-3 py-1.5 rounded-xl text-sm font-medium flex items-center gap-1">
          <span class="material-symbols-outlined" style="font-size:18px">warning</span>
          تنبيهات
        </a>
        <a href="/logout"    class="px-3 py-1.5 rounded-xl text-sm font-medium text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors mr-1">خروج</a>
      </div>
    </div>
  </nav>

  <!-- Main (Alpine.js root) -->
  <div x-data="productsApp()" x-init="init()" class="max-w-5xl mx-auto px-5 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black text-gray-900">المنتجات</h1>
        <p class="text-xs text-gray-400 mt-0.5" x-text="products.length + ' منتج مسجّل'"></p>
      </div>
      <button @click="openAdd()"
        class="flex items-center gap-2 px-5 py-2.5 text-white text-sm font-bold rounded-2xl shadow-md transition-all hover:shadow-lg hover:-translate-y-0.5"
        style="background: linear-gradient(135deg, #006948, #00a36c)">
        <span class="material-symbols-outlined" style="font-size:20px">add</span>
        إضافة منتج
      </button>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex items-center justify-center py-20 gap-3 text-gray-400">
      <div class="w-6 h-6 border-2 border-gray-200 border-t-[#006948] rounded-full animate-spin"></div>
      <span class="text-sm font-medium">جاري التحميل...</span>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && products.length === 0" x-cloak
      class="flex flex-col items-center py-24 text-gray-400 gap-4">
      <div class="w-24 h-24 rounded-full flex items-center justify-center text-5xl" style="background:#f0f7f4">🌿</div>
      <p class="font-bold text-base text-gray-500">لا توجد منتجات بعد</p>
      <p class="text-sm text-gray-400">اضغط "إضافة منتج" لتبدأ</p>
    </div>

    <!-- Product grid -->
    <div x-show="!loading && products.length > 0" x-cloak
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="p in products" :key="p.id">
        <div class="product-card card-enter flex flex-col">

          <!-- Product image -->
          <div class="h-44 relative overflow-hidden flex items-center justify-center"
               style="background: linear-gradient(145deg, #e6f3ee 0%, #d4ede5 50%, #c8e8dc 100%)">
            <div class="text-center">
              <div class="text-5xl mb-1">🌿</div>
              <div class="text-xs font-semibold opacity-50" style="color:#006948">ALYASMEEN</div>
            </div>
            <!-- Status badge -->
            <div class="absolute top-3 right-3">
              <span x-show="p.active"
                class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold text-white shadow-sm"
                style="background:#006948">
                <span class="w-1.5 h-1.5 rounded-full bg-white inline-block"></span> فعّال
              </span>
              <span x-show="!p.active"
                class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold bg-gray-200 text-gray-500">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-400 inline-block"></span> مخفي
              </span>
            </div>
            <!-- Price tag -->
            <div class="absolute bottom-3 left-3">
              <span class="text-white text-base font-black px-3 py-1 rounded-xl shadow-sm"
                    style="background:rgba(0,0,0,0.35); backdrop-filter:blur(4px)"
                    x-text="p.price.toFixed(2) + '₪'"></span>
            </div>
          </div>

          <div class="p-4 flex flex-col flex-1">
            <div class="mb-2">
              <span class="font-black text-gray-900 text-base leading-tight block" x-text="p.name"></span>
            </div>
            <p class="text-xs text-gray-500 leading-relaxed flex-1" x-show="p.description" x-text="p.description"></p>
            <div x-show="p.tags" class="mt-2">
              <span class="text-xs text-gray-400 bg-gray-50 px-2.5 py-1 rounded-xl border border-gray-100" x-text="p.tags"></span>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 mt-4 pt-3 border-t border-gray-100">
              <button @click="openEdit(p)"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 font-bold text-xs transition-colors">
                <span class="material-symbols-outlined" style="font-size:16px">edit</span>
                تعديل
              </button>
              <!-- Toggle switch -->
              <button @click="toggleProduct(p)"
                class="flex items-center gap-2 py-2 px-3 rounded-xl border text-xs font-bold transition-colors"
                :class="p.active ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-200 text-gray-500'">
                <div :class="p.active ? 'toggle-track toggle-on' : 'toggle-track toggle-off'">
                  <div class="toggle-thumb"></div>
                </div>
              </button>
              <button @click="deleteProduct(p)"
                class="flex items-center justify-center py-2 px-3 rounded-xl bg-red-50 hover:bg-red-100 border border-red-100 text-red-400 hover:text-red-600 transition-colors">
                <span class="material-symbols-outlined" style="font-size:18px">delete</span>
              </button>
            </div>
          </div>

        </div>
      </template>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" x-show="modal.open" x-cloak @click.self="closeModal()">
      <div class="bg-white rounded-3xl w-full max-w-md p-7 shadow-2xl" @click.stop>

        <div class="flex items-center justify-between mb-6">
          <h3 class="font-black text-gray-900 text-lg" x-text="modal.title"></h3>
          <button @click="closeModal()"
            class="w-9 h-9 flex items-center justify-center rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
            <span class="material-symbols-outlined" style="font-size:22px">close</span>
          </button>
        </div>

        <div class="flex flex-col gap-4">

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">اسم المنتج <span class="text-red-500">*</span></label>
            <input type="text" x-model="modal.name" placeholder="مثال: كريم اليدين" class="input-field" />
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">السعر (₪) <span class="text-red-500">*</span></label>
            <input type="number" x-model="modal.price" min="0.01" step="0.01" placeholder="0.00" class="input-field" />
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">الوصف</label>
            <textarea x-model="modal.description" rows="2" placeholder="وصف قصير للمنتج..." class="input-field resize-none"></textarea>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">الوسوم</label>
            <input type="text" x-model="modal.tags" placeholder="مثال: مرطب, طبيعي, للبشرة" class="input-field" />
            <p class="text-xs text-gray-400 mt-1">افصل بين الوسوم بفاصلة</p>
          </div>

        </div>

        <div x-show="modal.error" x-cloak
          class="flex items-center gap-2 bg-red-50 border border-red-100 rounded-2xl px-4 py-3 mt-4">
          <span class="material-symbols-outlined text-red-500" style="font-size:18px">error</span>
          <span class="text-sm text-red-700" x-text="modal.error"></span>
        </div>

        <div class="flex gap-3 mt-6">
          <button @click="saveProduct()" :disabled="modal.saving"
            class="flex-1 flex items-center justify-center gap-2 py-3 text-white font-bold text-sm rounded-2xl shadow-md transition-all"
            style="background:#006948" onmouseover="this.style.background='#004d33'" onmouseout="this.style.background='#006948'">
            <div x-show="modal.saving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span x-text="modal.saving ? 'جاري الحفظ...' : 'حفظ'"></span>
          </button>
          <button @click="closeModal()"
            class="flex-1 py-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 font-bold text-sm rounded-2xl transition-colors">
            إلغاء
          </button>
        </div>

      </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak x-transition
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
      <div class="bg-gray-900 text-white text-sm font-semibold shadow-2xl rounded-2xl px-6 py-3">
        <span x-text="toast.msg"></span>
      </div>
    </div>

  </div>

<script>
function productsApp() {
  return {
    products: [],
    loading: true,
    toast: { show: false, msg: '' },
    modal: {
      open: false, editingId: null, title: '',
      name: '', price: '', description: '', tags: '',
      error: '', saving: false
    },

    async init() {
      await this.loadProducts();
      this.loading = false;
      document.addEventListener('keydown', e => { if (e.key === 'Escape') this.closeModal(); });
    },

    async loadProducts() {
      const res = await fetch('/api/products');
      const data = await res.json();
      this.products = data.products || [];
    },

    openAdd() {
      Object.assign(this.modal, {
        open: true, editingId: null, title: 'إضافة منتج جديد',
        name: '', price: '', description: '', tags: '', error: '', saving: false
      });
    },

    openEdit(product) {
      Object.assign(this.modal, {
        open: true, editingId: product.id, title: 'تعديل المنتج',
        name: product.name, price: product.price,
        description: product.description || '', tags: product.tags || '',
        error: '', saving: false
      });
    },

    closeModal() { this.modal.open = false; },

    async saveProduct() {
      this.modal.error = '';
      if (!this.modal.name.trim()) { this.modal.error = 'يرجى إدخال اسم المنتج'; return; }
      const price = parseFloat(this.modal.price);
      if (!price || price <= 0) { this.modal.error = 'يرجى إدخال سعر صحيح أكبر من صفر'; return; }

      this.modal.saving = true;
      const body = {
        name: this.modal.name.trim(), price,
        description: this.modal.description.trim(),
        tags: this.modal.tags.trim()
      };
      const url = this.modal.editingId ? `/api/products/${this.modal.editingId}` : '/api/products';
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      this.modal.saving = false;

      if (res.ok) {
        const msg = this.modal.editingId ? '✅ تم تحديث المنتج' : '✅ تم إضافة المنتج';
        this.closeModal();
        await this.loadProducts();
        this.showToast(msg);
      } else {
        const err = await res.json().catch(() => ({}));
        this.modal.error = err.detail || 'حدث خطأ، يرجى المحاولة مجدداً';
      }
    },

    async toggleProduct(product) {
      const res = await fetch(`/api/products/${product.id}/toggle`, { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        await this.loadProducts();
        this.showToast(data.active ? '🟢 المنتج فعّال الآن' : '🔴 المنتج مخفي عن العملاء');
      }
    },

    async deleteProduct(product) {
      if (!confirm(`هل أنت متأكد من حذف "${product.name}"؟\nلا يمكن التراجع عن هذا الإجراء.`)) return;
      const res = await fetch(`/api/products/${product.id}/delete`, { method: 'POST' });
      if (res.ok) {
        await this.loadProducts();
        this.showToast('🗑️ تم حذف المنتج');
      }
    },

    showToast(msg) {
      this.toast.msg = msg;
      this.toast.show = true;
      setTimeout(() => { this.toast.show = false; }, 2500);
    }
  };
}
</script>
</body>
</html>
