<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/csrf.js"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal; font-style: normal; font-size: 24px;
      line-height: 1; letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap; direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: linear-gradient(145deg, #e6f3ee 0%, #f5faf8 45%, #e0f0ea 100%);
      min-height: 100vh;
    }
    .card-glass {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .btn-primary {
      background: #006948;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    .btn-primary:hover { background: #004d33; box-shadow: 0 6px 20px rgba(0,105,72,0.3); }
    .btn-primary:active { transform: translateY(1px); }
    .input-custom:focus {
      outline: none;
      border-color: #006948;
      box-shadow: 0 0 0 3px rgba(0,105,72,0.12);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease forwards; }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

  <div class="w-full max-w-sm fade-up">

    <!-- Logo area -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl shadow-xl mb-4"
           style="background: linear-gradient(135deg, #006948 0%, #00a36c 100%)">
        <span class="text-4xl">🌿</span>
      </div>
      <h1 class="text-3xl font-black text-gray-900 tracking-tight">ALYASMEEN</h1>
      <p class="text-sm text-gray-500 mt-1">لوحة إدارة الطلبات</p>
    </div>

    <!-- Card -->
    <div class="card-glass rounded-3xl shadow-2xl p-7">

      <!-- Error -->
      {% if error %}
      <div class="flex items-center gap-3 bg-red-50 border border-red-100 rounded-2xl px-4 py-3 mb-5">
        <span class="material-symbols-outlined text-red-500" style="font-size:20px">error</span>
        <span class="text-sm text-red-700 font-semibold">{{ error }}</span>
      </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="/login" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute top-1/2 -translate-y-1/2 right-3.5 text-gray-400" style="font-size:20px">mail</span>
            <input
              type="email"
              name="email"
              autofocus
              required
              autocomplete="username"
              placeholder="you@example.com"
              class="input-custom w-full border border-gray-200 rounded-2xl py-3 pr-11 pl-4 text-sm text-gray-800 bg-gray-50 transition-all"
              dir="ltr"
            />
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute top-1/2 -translate-y-1/2 right-3.5 text-gray-400" style="font-size:20px">lock</span>
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="أدخل كلمة المرور"
              class="input-custom w-full border border-gray-200 rounded-2xl py-3 pr-11 pl-4 text-sm text-gray-800 bg-gray-50 transition-all"
            />
          </div>
        </div>
        <button type="submit"
          class="btn-primary w-full py-3.5 rounded-2xl text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2">
          <span class="material-symbols-outlined" style="font-size:20px">login</span>
          دخول
        </button>
        <a href="/login/reset-request" class="text-center text-xs text-gray-500 hover:text-gray-700 font-semibold -mt-1">نسيت كلمة المرور؟</a>
      </form>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">ALYASMEEN Admin Dashboard · 2026</p>
  </div>

</body>
</html>
