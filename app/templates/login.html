<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — تسجيل الدخول</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50 flex items-center justify-center p-4">

  <div class="card w-full max-w-sm bg-white shadow-2xl border border-gray-100">
    <div class="card-body gap-5">

      <!-- Logo -->
      <div class="text-center">
        <div class="w-20 h-20 bg-emerald-50 border-2 border-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
          <span class="text-5xl">🌿</span>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">ALYASMEEN</h1>
        <p class="text-sm text-gray-500 mt-1">لوحة إدارة الطلبات</p>
      </div>

      <!-- Error -->
      {% if error %}
      <div class="alert alert-error text-sm py-2.5 rounded-xl">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="/login" class="flex flex-col gap-4">
        <div class="form-control">
          <label class="label pb-1">
            <span class="label-text font-semibold text-gray-700">كلمة المرور</span>
          </label>
          <input
            type="password"
            name="password"
            autofocus
            required
            placeholder="أدخل كلمة المرور"
            class="input input-bordered focus:input-success w-full text-gray-800"
          />
        </div>
        <button type="submit"
          class="btn w-full bg-emerald-600 hover:bg-emerald-700 border-0 text-white font-bold text-base shadow-sm mt-1">
          دخول
        </button>
      </form>

    </div>
  </div>

</body>
</html>
