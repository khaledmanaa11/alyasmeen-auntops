<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">

    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="text-3xl">🌿</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">ALYASMEEN</h1>
      <p class="text-gray-500 text-sm mt-1">لوحة إدارة الطلبات</p>
    </div>

    <!-- Error -->
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm text-center">
      {{ error }}
    </div>
    {% endif %}

    <!-- Form -->
    <form method="POST" action="/login">
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
        <input
          type="password"
          name="password"
          autofocus
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
          placeholder="أدخل كلمة المرور"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition-colors"
      >
        دخول
      </button>
    </form>
  </div>
</body>
</html>
