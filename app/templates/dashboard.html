<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — الإحصائيات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🌿</span>
        <span class="font-bold text-gray-900 text-lg">ALYASMEEN</span>
      </div>
      <div class="flex items-center gap-1">
        <a href="/orders"    class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">الطلبات</a>
        <a href="/dashboard" class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-100 text-emerald-700">الإحصائيات</a>
        <a href="/products"  class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">المنتجات</a>
        <a href="/broadcast" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">رسائل جماعية</a>
        <a href="/logout"    class="px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-red-500">خروج</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-4 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">الإحصائيات</h1>
        <p id="month-label" class="text-sm text-gray-500 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <select id="month-picker" onchange="onMonthChange()"
          class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 bg-white focus:outline-none focus:border-emerald-400">
          <option value="">هذا الشهر</option>
        </select>
        <button onclick="loadStats(document.getElementById('month-picker').value)"
          class="text-sm text-emerald-600 hover:text-emerald-700 font-medium">↻ تحديث</button>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 gap-4 mb-6 sm:grid-cols-4">
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-500 mb-1">طلبات هذا الشهر</p>
        <p id="stat-orders" class="text-2xl font-bold text-gray-900">—</p>
        <p id="stat-orders-diff" class="text-xs mt-1"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-500 mb-1">الإيرادات (₪)</p>
        <p id="stat-revenue" class="text-2xl font-bold text-gray-900">—</p>
        <p id="stat-revenue-diff" class="text-xs mt-1"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-500 mb-1">العملاء</p>
        <p id="stat-customers" class="text-2xl font-bold text-gray-900">—</p>
        <p class="text-xs text-gray-400 mt-1">إجمالي</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-500 mb-1">متوسط الطلب (₪)</p>
        <p id="stat-avg" class="text-2xl font-bold text-gray-900">—</p>
        <p class="text-xs text-gray-400 mt-1">هذا الشهر</p>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 gap-4 mb-6 sm:grid-cols-3">

      <!-- Daily Orders (takes 2/3) -->
      <div class="sm:col-span-2 bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-sm font-semibold text-gray-700 mb-4">الطلبات اليومية — آخر 30 يوم</p>
        <div class="relative h-48">
          <canvas id="chart-daily"></canvas>
        </div>
      </div>

      <!-- Status Donut (takes 1/3) -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col">
        <p class="text-sm font-semibold text-gray-700 mb-4">حالة الطلبات</p>
        <div class="relative flex-1 flex items-center justify-center">
          <canvas id="chart-status" style="max-height:160px"></canvas>
        </div>
        <div id="status-legend" class="mt-3 space-y-1"></div>
      </div>
    </div>

    <!-- Top Products -->
    <div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-sm font-semibold text-gray-700 mb-4">أفضل 5 منتجات — هذا الشهر</p>
      <div id="top-products">
        <p class="text-center text-gray-400 py-6 text-sm">جاري التحميل...</p>
      </div>
    </div>

  </div>

<script>
  const STATUS_LABEL = { to_do: 'يجب التجهيز', ready: 'جاهز', delivered: 'في الطريق', done: 'مكتمل' };
  const STATUS_COLOR_HEX = { to_do: '#3b82f6', ready: '#f59e0b', delivered: '#f97316', done: '#10b981' };
  const AR_MONTHS = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  let dailyChart = null;
  let statusChart = null;

  async function loadStats(month = '') {
    try {
      const url = month ? `/api/dashboard/stats?month=${month}` : '/api/dashboard/stats';
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const d = await res.json();
      renderCards(d, month);
      renderDailyChart(d.daily_orders || []);
      renderStatusChart(d.status_breakdown || []);
      renderTopProducts(d.top_products || []);
    } catch (e) {
      console.error(e);
    }
  }

  function onMonthChange() {
    loadStats(document.getElementById('month-picker').value);
  }

  async function loadMonths() {
    try {
      const res = await fetch('/api/reports/months');
      const d = await res.json();
      const picker = document.getElementById('month-picker');
      (d.months || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = `${m.year}-${String(m.month).padStart(2,'0')}`;
        opt.textContent = `${AR_MONTHS[m.month]} ${m.year}`;
        picker.appendChild(opt);
      });
    } catch {}
  }

  function renderCards(d, month) {
    const m = d.this_month || {};
    const p = d.last_month  || {};
    const isArchive = !!month;

    document.getElementById('stat-orders').textContent    = m.orders ?? 0;
    document.getElementById('stat-revenue').textContent   = '₪' + (m.revenue ?? 0).toFixed(0);
    document.getElementById('stat-customers').textContent = d.total_customers ?? 0;
    const avg = m.orders ? (m.revenue / m.orders).toFixed(0) : 0;
    document.getElementById('stat-avg').textContent = '₪' + avg;

    // Month label
    if (isArchive) {
      const [y, mo] = month.split('-').map(Number);
      document.getElementById('month-label').textContent = `${AR_MONTHS[mo]} ${y} — أرشيف`;
    } else {
      const now = new Date();
      document.getElementById('month-label').textContent =
        now.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
    }

    // Diff (only meaningful for live month)
    if (!isArchive) {
      renderDiff('stat-orders-diff',  m.orders,  p.orders,  'طلب');
      renderDiff('stat-revenue-diff', m.revenue, p.revenue, '₪');
    } else {
      document.getElementById('stat-orders-diff').textContent  = '';
      document.getElementById('stat-revenue-diff').textContent = '';
    }
  }

  function renderDiff(elId, current, prev, unit) {
    const el = document.getElementById(elId);
    if (!prev || prev === 0) { el.textContent = ''; return; }
    const pct = Math.round(((current - prev) / prev) * 100);
    if (pct > 0)      { el.textContent = `▲ ${pct}% عن الشهر الماضي`; el.className = 'text-xs text-emerald-600 mt-1'; }
    else if (pct < 0) { el.textContent = `▼ ${Math.abs(pct)}% عن الشهر الماضي`; el.className = 'text-xs text-red-500 mt-1'; }
    else              { el.textContent = 'نفس الشهر الماضي'; el.className = 'text-xs text-gray-400 mt-1'; }
  }

  function renderDailyChart(daily) {
    const labels = daily.map(r => {
      const d = new Date(r.day);
      return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
    });
    const data = daily.map(r => r.count);

    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(document.getElementById('chart-daily'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data,
          borderColor: '#059669',
          backgroundColor: 'rgba(5,150,105,0.08)',
          borderWidth: 2,
          pointRadius: data.length > 20 ? 0 : 3,
          tension: 0.3,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 7 } },
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: '#f3f4f6' } }
        }
      }
    });
  }

  function renderStatusChart(breakdown) {
    const labels = breakdown.map(r => STATUS_LABEL[r.status] || r.status);
    const data   = breakdown.map(r => r.count);
    const colors = breakdown.map(r => STATUS_COLOR_HEX[r.status] || '#9ca3af');
    const total  = data.reduce((a, b) => a + b, 0);

    if (statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('chart-status'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '65%',
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/total*100)}%)` }
        }}
      }
    });

    // Legend
    document.getElementById('status-legend').innerHTML = breakdown.map((r, i) => `
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${colors[i]}"></span>
          <span class="text-gray-600">${labels[i]}</span>
        </div>
        <span class="font-medium text-gray-800">${r.count}</span>
      </div>`).join('');
  }

  function renderTopProducts(products) {
    const el = document.getElementById('top-products');
    if (!products.length) {
      el.innerHTML = '<p class="text-center text-gray-400 py-6 text-sm">لا توجد بيانات هذا الشهر</p>';
      return;
    }
    const maxQty = Math.max(...products.map(p => p.qty), 1);
    el.innerHTML = `
      <div class="space-y-3">
        ${products.map((p, i) => `
          <div>
            <div class="flex items-center justify-between text-sm mb-1">
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-bold">${i+1}</span>
                <span class="text-gray-800 font-medium">${p.name}</span>
              </div>
              <div class="text-left">
                <span class="text-gray-900 font-semibold">${p.qty} قطعة</span>
                <span class="text-gray-400 mr-2 text-xs">₪${p.revenue.toFixed(0)}</span>
              </div>
            </div>
            <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500 rounded-full transition-all" style="width:${Math.round(p.qty/maxQty*100)}%"></div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  loadMonths();
  loadStats();
</script>
</body>
</html>
