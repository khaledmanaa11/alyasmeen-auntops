<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALYASMEEN — الإحصائيات</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    body { background: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center shadow-sm shrink-0">
          <span class="text-white text-base leading-none">🌿</span>
        </div>
        <div class="leading-tight">
          <span class="font-black text-gray-900 text-base tracking-tight block">ALYASMEEN</span>
          <span class="text-xs text-gray-400 block">لوحة الإدارة</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <a href="/orders"    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">الطلبات</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-sm">الإحصائيات</a>
        <a href="/products"  class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">المنتجات</a>
        <a href="/broadcast" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">رسائل جماعية</a>
        <a href="/logout"    class="mr-1 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">خروج</a>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="bg-white border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-5 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-black text-gray-900">الإحصائيات</h1>
        <p id="month-label" class="text-sm text-gray-500 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <select id="month-picker" onchange="onMonthChange()"
          class="select select-bordered select-sm text-gray-700 focus:select-success min-w-36 rounded-xl">
          <option value="">هذا الشهر</option>
        </select>
        <button onclick="loadStats(document.getElementById('month-picker').value)"
          class="flex items-center gap-2 px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-sm font-bold transition-colors">
          ↻ تحديث
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-5 py-6">

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center mb-3">
          <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <div class="text-xs text-gray-500 font-semibold mb-1">طلبات الشهر</div>
        <div id="stat-orders" class="text-3xl font-black text-gray-900">—</div>
        <div id="stat-orders-diff" class="text-xs mt-1"></div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center mb-3">
          <svg class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div class="text-xs text-gray-500 font-semibold mb-1">الإيرادات (₪)</div>
        <div id="stat-revenue" class="text-3xl font-black text-gray-900">—</div>
        <div id="stat-revenue-diff" class="text-xs mt-1"></div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center mb-3">
          <svg class="w-5 h-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div class="text-xs text-gray-500 font-semibold mb-1">إجمالي العملاء</div>
        <div id="stat-customers" class="text-3xl font-black text-gray-900">—</div>
        <div class="text-xs text-gray-400 mt-1">مسجّلون في قاعدة البيانات</div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center mb-3">
          <svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <div class="text-xs text-gray-500 font-semibold mb-1">متوسط الطلب (₪)</div>
        <div id="stat-avg" class="text-3xl font-black text-gray-900">—</div>
        <div class="text-xs text-gray-400 mt-1">هذا الشهر</div>
      </div>

    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 gap-5 mb-5 sm:grid-cols-3">

      <div class="sm:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
        <h3 class="font-bold text-gray-800 text-sm mb-4">الطلبات اليومية — آخر 30 يوم</h3>
        <div id="chart-daily" style="height:220px"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
        <h3 class="font-bold text-gray-800 text-sm mb-4">حالة الطلبات</h3>
        <div id="chart-status" style="height:160px"></div>
        <div id="status-legend" class="mt-4 space-y-2"></div>
      </div>

    </div>

    <!-- Top Products -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h3 class="font-bold text-gray-800 text-sm mb-5">🏆 أفضل 5 منتجات — هذا الشهر</h3>
      <div id="top-products">
        <div class="flex items-center justify-center py-10 gap-2 text-gray-400">
          <span class="loading loading-spinner loading-sm"></span>
          <span class="text-sm">جاري التحميل...</span>
        </div>
      </div>
    </div>

  </div>

<script>
  const STATUS_LABEL     = { to_do: 'يجب التجهيز', ready: 'جاهز', delivered: 'في الطريق', done: 'مكتمل' };
  const STATUS_COLOR_HEX = { to_do: '#3b82f6', ready: '#f59e0b', delivered: '#f97316', done: '#10b981' };
  const AR_MONTHS = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  let dailyChart  = null;
  let statusChart = null;
  const ECHARTS_FONT = 'Cairo, sans-serif';

  async function loadStats(month = '') {
    try {
      const url = month ? `/api/dashboard/stats?month=${month}` : '/api/dashboard/stats';
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const d = await res.json();
      renderCards(d, month);
      renderDailyChart(d.daily_orders || []);
      renderStatusChart(d.status_breakdown || []);
      renderTopProducts(d.top_products || []);
    } catch (e) { console.error(e); }
  }

  function onMonthChange() {
    loadStats(document.getElementById('month-picker').value);
  }

  async function loadMonths() {
    try {
      const res = await fetch('/api/reports/months');
      const d = await res.json();
      const picker = document.getElementById('month-picker');
      (d.months || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = `${m.year}-${String(m.month).padStart(2,'0')}`;
        opt.textContent = `${AR_MONTHS[m.month]} ${m.year}`;
        picker.appendChild(opt);
      });
    } catch {}
  }

  function renderCards(d, month) {
    const m = d.this_month || {};
    const p = d.last_month  || {};
    const isArchive = !!month;

    document.getElementById('stat-orders').textContent    = m.orders ?? 0;
    document.getElementById('stat-revenue').textContent   = '₪' + (m.revenue ?? 0).toFixed(0);
    document.getElementById('stat-customers').textContent = d.total_customers ?? 0;
    const avg = m.orders ? (m.revenue / m.orders).toFixed(0) : 0;
    document.getElementById('stat-avg').textContent = '₪' + avg;

    if (isArchive) {
      const [y, mo] = month.split('-').map(Number);
      document.getElementById('month-label').textContent = `${AR_MONTHS[mo]} ${y} — أرشيف`;
    } else {
      document.getElementById('month-label').textContent =
        new Date().toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
    }

    if (!isArchive) {
      renderDiff('stat-orders-diff',  m.orders,  p.orders,  'طلب');
      renderDiff('stat-revenue-diff', m.revenue, p.revenue, '₪');
    } else {
      document.getElementById('stat-orders-diff').textContent  = '';
      document.getElementById('stat-revenue-diff').textContent = '';
    }
  }

  function renderDiff(elId, current, prev) {
    const el = document.getElementById(elId);
    if (!prev || prev === 0) { el.textContent = ''; return; }
    const pct = Math.round(((current - prev) / prev) * 100);
    if (pct > 0)      { el.innerHTML = `<span class="text-emerald-600 font-semibold">▲ ${pct}% عن الشهر الماضي</span>`; }
    else if (pct < 0) { el.innerHTML = `<span class="text-red-500 font-semibold">▼ ${Math.abs(pct)}% عن الشهر الماضي</span>`; }
    else              { el.innerHTML = `<span class="text-gray-400">نفس الشهر الماضي</span>`; }
  }

  function renderDailyChart(daily) {
    const labels = daily.map(r =>
      new Date(r.day).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })
    );
    const data = daily.map(r => r.count);

    if (!dailyChart) {
      dailyChart = echarts.init(document.getElementById('chart-daily'));
    }

    dailyChart.setOption({
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#1f2937',
        borderColor: '#374151',
        textStyle: { fontFamily: ECHARTS_FONT, color: '#f9fafb', fontSize: 13 },
        formatter: params => `${params[0].axisValue}<br/><b>${params[0].value} طلب</b>`
      },
      grid: { left: '1%', right: '2%', bottom: '3%', top: '5%', containLabel: true },
      xAxis: {
        type: 'category',
        data: labels,
        axisLabel: { fontFamily: ECHARTS_FONT, fontSize: 11, color: '#6b7280' },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#e5e7eb' } }
      },
      yAxis: {
        type: 'value',
        minInterval: 1,
        axisLabel: { fontFamily: ECHARTS_FONT, fontSize: 11, color: '#9ca3af' },
        splitLine: { lineStyle: { color: '#f3f4f6' } },
        axisLine: { show: false }
      },
      series: [{
        data,
        type: 'bar',
        barMaxWidth: 36,
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: '#059669' },
            { offset: 1, color: '#6ee7b7' }
          ]),
          borderRadius: [6, 6, 0, 0]
        },
        emphasis: { itemStyle: { color: '#047857' } }
      }]
    });
  }

  function renderStatusChart(breakdown) {
    if (!statusChart) {
      statusChart = echarts.init(document.getElementById('chart-status'));
    }

    statusChart.setOption({
      tooltip: {
        trigger: 'item',
        backgroundColor: '#1f2937',
        borderColor: '#374151',
        textStyle: { fontFamily: ECHARTS_FONT, color: '#f9fafb', fontSize: 13 },
        formatter: params => `${params.name}<br/><b>${params.value} طلب</b> (${params.percent}%)`
      },
      series: [{
        type: 'pie',
        radius: ['52%', '80%'],
        center: ['50%', '50%'],
        avoidLabelOverlap: false,
        label: { show: false },
        emphasis: {
          label: { show: true, fontSize: 13, fontWeight: 'bold', fontFamily: ECHARTS_FONT }
        },
        labelLine: { show: false },
        data: breakdown.map(r => ({
          value: r.count,
          name: STATUS_LABEL[r.status] || r.status,
          itemStyle: { color: STATUS_COLOR_HEX[r.status] || '#9ca3af' }
        }))
      }]
    });

    document.getElementById('status-legend').innerHTML = breakdown.map(r => `
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full inline-block shrink-0" style="background:${STATUS_COLOR_HEX[r.status]}"></span>
          <span class="text-gray-600 font-medium">${STATUS_LABEL[r.status] || r.status}</span>
        </div>
        <span class="font-bold text-gray-800">${r.count}</span>
      </div>`).join('');
  }

  function renderTopProducts(products) {
    const el = document.getElementById('top-products');
    if (!products.length) {
      el.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">لا توجد بيانات هذا الشهر</p>';
      return;
    }
    const maxQty = Math.max(...products.map(p => p.qty), 1);
    el.innerHTML = `<div class="space-y-4">
      ${products.map((p, i) => `
        <div>
          <div class="flex items-center justify-between text-sm mb-2">
            <div class="flex items-center gap-2.5">
              <span class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-black shrink-0
                ${i === 0 ? 'bg-amber-100 text-amber-700' : i === 1 ? 'bg-gray-100 text-gray-600' : i === 2 ? 'bg-orange-50 text-orange-600' : 'bg-emerald-50 text-emerald-700'}">
                ${i+1}
              </span>
              <span class="text-gray-800 font-bold">${p.name}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-gray-900 font-black">${p.qty} قطعة</span>
              <span class="px-2 py-0.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700">₪${p.revenue.toFixed(0)}</span>
            </div>
          </div>
          <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-700"
              style="width:${Math.round(p.qty/maxQty*100)}%; background: linear-gradient(90deg, #059669, #34d399)">
            </div>
          </div>
        </div>`).join('')}
    </div>`;
  }

  window.addEventListener('resize', () => {
    dailyChart && dailyChart.resize();
    statusChart && statusChart.resize();
  });

  loadMonths();
  loadStats();
</script>
</body>
</html>
